[project]
name = "llm-council"
version = "0.1.0"
description = "Your LLM Council"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
]
[project.optional-dependencies]
research = ['sqlalchemy>=2.0', 'alembic>=1.13', 'psycopg[binary]>=3.2', 'numpy>=1.26', 'scikit-learn>=1.5', 'qdrant-client>=1.12']
ml = ['sentence-transformers>=3.0', 'transformers>=4.45', 'torch>=2.4', 'sentencepiece']
dev = ['pytest>=8', 'pytest-asyncio>=0.24', 'ruff>=0.9']

[tool.pytest.ini_options]
pythonpath = ['.']
testpaths = ['tests']

[tool.ruff]
line-length = 110
